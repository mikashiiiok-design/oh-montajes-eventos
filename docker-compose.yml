services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oh_app
      POSTGRES_PASSWORD: oh_local_dev_password
      POSTGRES_DB: oh_app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oh_app -d oh_app']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
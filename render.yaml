services:
  - type: web
    name: oh-api-test
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: npm run api:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGINS
        value: https://oh-montajes-eventos.pages.dev,https://www.oh-montajes-eventos.pages.dev,https://render-backend-test.oh-montajes-eventos.pages.dev,https://chidalgodev.xyz,https://www.chidalgodev.xyz,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: oh-postgres-test
          property: connectionString

databases:
  - name: oh-postgres-test
    databaseName: oh_app
    user: oh_app
    plan: free
    region: ohio
    postgresMajorVersion: '17'
    ipAllowList: []